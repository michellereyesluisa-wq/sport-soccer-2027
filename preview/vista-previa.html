<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sport Soccer 2027 - Vista Previa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark:#0b4d2e; --green:#0f6b3d; --green-light:#148a4f;
  --gold:#e8b400; --gold-light:#f2c94c; --red:#c0392b; --red-dark:#a52a20;
  --white:#fff; --off-white:#f5f7f5; --text-dark:#1a2e22; --text-muted:#5b6d63;
  --radius-lg:20px; --radius-md:14px; --radius-sm:8px;
  --shadow:0 8px 24px rgba(11,77,46,0.12);
  --font-display:"Poppins","Segoe UI",sans-serif; --font-body:"Inter","Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
body{font-family:var(--font-body);background:var(--off-white);color:var(--text-dark);}
img{max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 20px;}
.site-header{background:linear-gradient(180deg,var(--green-dark),var(--green));border-bottom:4px solid var(--red);position:sticky;top:0;z-index:50;}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;color:var(--white);}
.brand-badge{width:44px;height:44px;border-radius:50%;background:var(--green-dark);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand-text .name{font-family:var(--font-display);font-weight:800;font-style:italic;font-size:19px;letter-spacing:.5px;}
.brand-text .year{color:var(--gold-light);font-weight:700;font-size:13px;}
.main-nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.main-nav a{color:var(--white);font-weight:600;font-size:14px;padding:6px 2px;position:relative;cursor:pointer;}
.main-nav a.active{color:var(--gold-light);}
.main-nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:3px;background:var(--gold);border-radius:2px;}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.bets-pill{background:var(--red);color:var(--white);font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;border:none;display:flex;align-items:center;gap:8px;}
.bets-pill:hover{background:var(--red-dark);}
.lang-select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);color:var(--white);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;}
.hero{background:linear-gradient(rgba(11,77,46,.82),rgba(11,77,46,.92)),url("https://images.unsplash.com/photo-1459865264687-595d652de67e?w=1200&q=80") center/cover;color:var(--white);border-radius:var(--radius-lg);text-align:center;padding:56px 24px;margin:24px auto;max-width:1140px;box-shadow:var(--shadow);}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--red);padding:8px 18px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.5px;}
.hero h1{font-family:var(--font-display);font-weight:800;font-style:italic;font-size:clamp(34px,7vw,62px);margin:18px 0 12px;letter-spacing:1px;}
.hero p{max-width:620px;margin:0 auto 26px;color:rgba(255,255,255,.9);font-size:16px;line-height:1.5;}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-gold{background:var(--gold);color:var(--green-dark);font-weight:800;border:none;padding:14px 26px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:8px;}
.btn-outline{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.5);padding:14px 26px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:8px;font-weight:700;}
.flag-icon{width:22px;height:16px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08);vertical-align:-3px;margin-right:4px;}
.sponsors-box{border:2px solid var(--gold);border-radius:var(--radius-lg);max-width:1140px;margin:0 auto 24px;padding:22px;text-align:center;background:var(--white);}
.sponsors-title{color:var(--green);font-weight:800;letter-spacing:1px;margin-bottom:16px;font-size:15px;}
.sponsors-row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;align-items:center;}
.sponsor-badge{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-dark);background:var(--off-white);padding:10px 18px;border-radius:999px;font-size:14px;}
.section{max-width:1140px;margin:0 auto 32px;padding:0 20px;}
.section-title{display:flex;align-items:center;gap:10px;color:var(--green-dark);font-family:var(--font-display);font-weight:800;font-size:24px;margin-bottom:4px;}
.section-sub{color:var(--text-muted);margin-bottom:18px;font-size:14px;}
.player-list{display:flex;flex-direction:column;gap:12px;}
.player-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--white);border-radius:var(--radius-md);padding:14px 18px;box-shadow:var(--shadow);}
.player-left{display:flex;align-items:center;gap:14px;}
.player-avatar{width:52px;height:52px;border-radius:50%;background:var(--green-light);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;}
.player-name{font-weight:700;font-size:16px;}
.player-country{color:var(--text-muted);font-size:13px;display:flex;gap:6px;align-items:center;}
.player-right{display:flex;align-items:center;gap:12px;}
.player-goals{color:var(--green);font-weight:800;font-size:16px;}
.player-rating{background:var(--gold-light);color:var(--green-dark);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;}
.matchday-card{background:var(--white);border-left:4px solid var(--red);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow);}
.matchday-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:720px){.matchday-grid{grid-template-columns:1fr 1fr;}}
.matchday-header{display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:13px;margin-bottom:12px;}
.live-badge{background:#fdeaea;color:var(--red);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;}
.team-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.team-row-left{display:flex;align-items:center;gap:10px;font-weight:600;}
.team-score{background:#e8f7ee;color:var(--green);font-weight:800;padding:3px 12px;border-radius:8px;min-width:34px;text-align:center;}
.news-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:720px){.news-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1020px){.news-grid{grid-template-columns:1fr 1fr 1fr;}}
.news-card{background:var(--white);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.news-image{height:120px;background-size:cover;background-position:center;}
.news-body{padding:16px 18px;}
.news-time{color:var(--text-muted);font-size:12px;font-weight:700;letter-spacing:.4px;margin-bottom:8px;}
.news-headline{font-weight:700;font-size:15px;line-height:1.4;}
.groups-grid{display:grid;grid-template-columns:1fr;gap:20px;}
@media(min-width:720px){.groups-grid{grid-template-columns:1fr 1fr;}}
.group-card{background:var(--white);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);}
.group-header{background:var(--green);color:var(--white);font-weight:700;padding:12px 18px;}
table.standings-table{width:100%;border-collapse:collapse;}
.standings-table th{text-align:left;font-size:11px;color:var(--text-muted);padding:10px 14px 6px;border-bottom:2px solid var(--gold-light);}
.standings-table td{padding:10px 14px;font-size:14px;border-bottom:1px solid #eef1ee;}
.standings-table td.pts{color:var(--green);font-weight:800;}
.team-cell{display:flex;align-items:center;gap:8px;font-weight:600;}
.rank{color:var(--text-muted);width:18px;display:inline-block;}
.bracket-title{text-align:center;font-weight:800;color:var(--text-dark);letter-spacing:1px;margin:8px 0 22px;font-size:15px;border-bottom:2px solid var(--gold);padding-bottom:14px;}
.bracket-grid{display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:720px){.bracket-grid{grid-template-columns:1fr 1fr;}}
.bracket-match{display:flex;align-items:center;gap:14px;}
.bracket-teams{flex:1;display:flex;flex-direction:column;gap:8px;}
.bracket-team{background:var(--white);border:1px solid #e6ebe6;border-radius:var(--radius-sm);padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
.bracket-vs-line{width:24px;height:2px;background:#d6ded6;}
.bracket-winner{border:2px dashed #d6ded6;border-radius:var(--radius-sm);padding:14px;text-align:center;color:var(--text-muted);font-weight:700;font-size:13px;min-width:110px;}
.stadium-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px;}
@media(min-width:720px){.stadium-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1020px){.stadium-grid{grid-template-columns:1fr 1fr 1fr;}}
.stadium-card{background:var(--white);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);}
.stadium-photo{height:110px;background-size:cover;background-position:center;}
.stadium-card-body{display:flex;gap:12px;align-items:center;padding:12px 16px;}
.stadium-name{font-weight:700;font-size:14px;}
.stadium-city{color:var(--text-muted);font-size:12px;}
.bets-gate-wrap{display:flex;justify-content:center;padding:40px 20px;}
.bets-gate{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow);max-width:460px;width:100%;overflow:hidden;}
.bets-gate-header{background:var(--green);color:var(--white);padding:18px 22px;font-weight:800;display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.4px;}
.bets-gate-body{padding:28px 26px;}
.gate-icon{width:72px;height:72px;border-radius:50%;background:var(--gold-light);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;}
.gate-desc{text-align:center;color:var(--text-muted);font-size:14px;margin-bottom:22px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;}
.form-group input{width:100%;border:1.5px solid #dde5dd;border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;font-family:monospace;}
.form-group input:focus{outline:none;border-color:var(--green);}
.error-text{color:var(--red);font-size:12px;margin-top:6px;font-weight:600;}
.btn-verify{width:100%;background:var(--green);color:var(--white);font-weight:700;border:none;padding:14px;border-radius:var(--radius-sm);font-size:15px;margin-top:4px;}
.btn-verify:hover{background:var(--green-dark);}
.gate-legal{text-align:center;font-size:11px;color:var(--text-muted);margin-top:16px;line-height:1.5;}
.bets-unlocked-banner{background:#e8f7ee;color:var(--green-dark);font-weight:700;padding:14px 20px;border-radius:var(--radius-sm);margin-bottom:22px;text-align:center;font-size:14px;}
.odds-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:720px){.odds-grid{grid-template-columns:1fr 1fr;}}
.odds-card{background:var(--white);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow);}
.odds-teams{font-weight:700;margin-bottom:12px;font-size:14px;}
.odds-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #eef1ee;font-size:13px;}
.odds-value{background:var(--off-white);font-weight:800;color:var(--green);padding:4px 10px;border-radius:8px;}
.btn-place{background:var(--red);color:var(--white);font-weight:700;border:none;padding:6px 14px;border-radius:999px;font-size:12px;}
.site-footer{background:var(--green-dark);color:rgba(255,255,255,.85);padding:36px 20px 24px;margin-top:40px;}
.footer-inner{max-width:1140px;margin:0 auto;text-align:center;}
.footer-brand{font-family:var(--font-display);font-weight:800;font-style:italic;color:var(--white);font-size:18px;margin-bottom:6px;}
.footer-sponsors{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:18px 0;}
.footer-sponsors span{background:rgba(255,255,255,.08);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;}
.footer-legal{font-size:12px;color:rgba(255,255,255,.55);margin-top:14px;line-height:1.6;}
.page{display:none;}
.page.active{display:block;}
.preview-banner{background:#fff7d6;color:#7a5b00;text-align:center;font-size:12px;padding:8px;font-weight:600;}
</style>
</head>
<body>
<div class="preview-banner">Vista previa estatica de Sport Soccer 2027 (datos de ejemplo, sin conexion real a MongoDB)</div>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" onclick="showPage('home')">
      <div class="brand-badge">&#127942;</div>
      <div class="brand-text"><span class="name">SPORT SOCCER</span><span class="year">2027</span></div>
    </a>
    <nav class="main-nav">
      <a onclick="showPage('home')" data-page="home" class="active" id="nav-home">Inicio</a>
      <a onclick="showPage('news')" data-page="news" id="nav-news">Noticias</a>
      <a onclick="showPage('standings')" data-page="standings" id="nav-standings">Clasificaciones</a>
      <a onclick="showPage('calendar')" data-page="calendar" id="nav-calendar">Calendario</a>
    </nav>
    <div class="header-actions">
      <a class="bets-pill" onclick="showPage('bets')">&#128274; <span id="nav-bets">Apuestas</span></a>
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="zh">中文</option>
        <option value="pt">PT</option>
      </select>
    </div>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="page-home" class="page active">
    <div class="container">
      <div class="hero">
        <span class="hero-badge">&#127942; <span id="t-hero_badge"></span></span>
        <h1>SPORT SOCCER 2027</h1>
        <p id="t-hero_subtitle"></p>
        <div class="hero-actions">
          <a class="btn-gold" onclick="showPage('bets')">&#128200; <span id="t-hero_bets"></span></a>
          <a class="btn-outline" onclick="showPage('calendar')">&#128197; <span id="t-hero_calendar"></span></a>
        </div>
      </div>
      <div class="sponsors-box">
        <div class="sponsors-title">&#11088; <span id="t-sponsors_title"></span> &#11088;</div>
        <div class="sponsors-row" id="sponsorsRow"></div>
      </div>
    </div>

    <section class="section">
      <div class="matchday-card">
        <div class="matchday-header">
          <h2 class="section-title" style="margin-bottom:0;">&#128200; <span id="t-matchday"></span></h2>
          <span class="live-badge" id="t-live"></span>
        </div>
        <div class="matchday-grid" id="matchdayGrid"></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">&#11088; <span id="t-star_players"></span></h2>
      <p class="section-sub" id="t-star_players_sub"></p>
      <div class="player-list" id="playerList"></div>
    </section>
  </section>

  <!-- NEWS -->
  <section id="page-news" class="page">
    <section class="section" style="margin-top:24px;">
      <h2 class="section-title">&#128240; <span id="t-news_title"></span></h2>
      <div class="news-grid" id="newsGrid"></div>
    </section>
  </section>

  <!-- STANDINGS -->
  <section id="page-standings" class="page">
    <section class="section" style="margin-top:24px;">
      <h2 class="section-title">&#127942; <span id="t-standings_title"></span></h2>
      <div class="groups-grid" id="groupsGrid"></div>
    </section>
  </section>

  <!-- CALENDAR -->
  <section id="page-calendar" class="page">
    <section class="section" style="margin-top:24px;">
      <h2 class="section-title">&#128197; <span id="t-calendar_title"></span></h2>
      <div class="bracket-title" id="t-round16"></div>
      <div class="bracket-grid" id="bracketGrid"></div>
      <h2 class="section-title" style="margin-top:40px;">&#127967; <span id="t-stadiums_title"></span></h2>
      <div class="stadium-grid" id="stadiumGrid"></div>
    </section>
  </section>

  <!-- BETS -->
  <section id="page-bets" class="page">
    <div id="betsGate" class="bets-gate-wrap">
      <div class="bets-gate">
        <div class="bets-gate-header">&#128737; <span id="t-bets_title"></span></div>
        <div class="bets-gate-body">
          <div class="gate-icon">&#128100;&#10133;</div>
          <p class="gate-desc" id="t-bets_locked_desc"></p>
          <form onsubmit="verifyCurp(event)">
            <div class="form-group">
              <label id="t-curp_label"></label>
              <input id="curpInput" maxlength="18" required />
              <div class="error-text" id="curpError" style="display:none;"></div>
            </div>
            <button class="btn-verify" type="submit" id="t-verify_btn"></button>
          </form>
          <p class="gate-legal" id="t-curp_legal"></p>
        </div>
      </div>
    </div>
    <section class="section" id="oddsBoard" style="display:none; margin-top:24px;">
      <div class="bets-unlocked-banner">&#9989; <span id="t-bets_welcome"></span></div>
      <div class="odds-grid" id="oddsGrid"></div>
    </section>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">SPORT SOCCER 2027</div>
    <div class="footer-sponsors" id="footerSponsors"></div>
    <div class="footer-legal">© 2027 Sport Soccer. <span id="t-footer_rights"></span><br><span id="t-footer_disclaimer"></span></div>
  </div>
</footer>

function validateCurpFormat(curp){
  return /^[A-Z]{4}\d{6}[HM][A-Z]{5}[A-Z0-9]{2}$/.test(curp.toUpperCase());
}
function calculateAgeFromCurp(curp){
  const yy = parseInt(curp.substring(4,6),10);
  const mm = parseInt(curp.substring(6,8),10);
  const dd = parseInt(curp.substring(8,10),10);
  const currentYearFull = 2026;
  const currentYear2 = currentYearFull % 100;
  const century = yy > currentYear2 ? 1900 : 2000;
  const birthDate = new Date(century+yy, mm-1, dd);
  const today = new Date(2026,8,14);
  let age = today.getFullYear()-birthDate.getFullYear();
  const m = today.getMonth()-birthDate.getMonth();
  if(m<0 || (m===0 && today.getDate()<birthDate.getDate())) age--;
  return age;
}
function verifyCurp(e){
  e.preventDefault();
  const dict = translations[currentLang];
  const input = document.getElementById("curpInput");
  const errorEl = document.getElementById("curpError");
  const curp = input.value.trim().toUpperCase();
  if(!validateCurpFormat(curp)){
    errorEl.textContent = dict.curp_invalid;
    errorEl.style.display = "block";
    return;
  }
  const age = calculateAgeFromCurp(curp);
  if(age < 18){
    errorEl.textContent = dict.curp_underage;
    errorEl.style.display = "block";
    return;
  }
  errorEl.style.display = "none";
  document.getElementById("betsGate").style.display = "none";
  document.getElementById("oddsBoard").style.display = "block";
}
